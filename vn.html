<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web VN Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #1a202c; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* Background Layer */
        #bg-layer {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            transition: background-image 0.5s ease-in-out, opacity 0.5s ease-in-out;
            z-index: 1;
        }

        /* Sprite Layer */
        #sprite-layer {
            position: absolute; inset: 0;
            display: flex; justify-content: center; align-items: flex-end;
            z-index: 2; pointer-events: none;
        }

        .sprite {
            position: absolute; bottom: 0;
            height: 85%; max-height: 800px;
            object-fit: contain;
            transition: all 0.3s ease-in-out;
            opacity: 0; transform: translateY(20px);
        }

        .sprite.active { opacity: 1; transform: translateY(0); }
        .pos-left { left: 10%; transform: translateX(0); }
        .pos-center { left: 50%; transform: translateX(-50%); }
        .pos-right { right: 10%; transform: translateX(0); }
        .pos-center.active { transform: translateX(-50%) translateY(0); }

        /* UI Layer */
        #ui-layer {
            position: absolute; inset: 0;
            z-index: 10; display: flex; flex-direction: column; justify-content: flex-end;
        }

        /* Main Menu */
        #main-menu {
            position: absolute; inset: 0;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=80') center/cover;
            z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        /* Dialog Box */
        #textbox-container {
            position: relative;
            width: 90%; margin: 0 auto 24px auto;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; padding: 24px 32px;
            backdrop-filter: blur(8px);
            min-height: 140px; cursor: pointer;
            display: none; /* Hidden by default */
        }

        #speaker-name {
            position: absolute; top: -20px; left: 24px;
            background: #3b82f6; color: white;
            padding: 4px 16px; border-radius: 6px;
            font-weight: bold; font-size: 1.1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: none;
        }

        #dialog-text {
            color: #f8fafc; font-size: 1.25rem; line-height: 1.6;
        }

        .click-indicator {
            position: absolute; bottom: 12px; right: 16px;
            color: white; font-size: 1.5rem;
            animation: bounce 1s infinite;
            display: none;
        }

        /* Choice Menu */
        #choice-container {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; gap: 16px;
        }

        .choice-btn {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #3b82f6; color: white;
            padding: 12px 32px; border-radius: 8px; font-size: 1.2rem;
            width: 80%; max-width: 600px;
            transition: all 0.2s; cursor: pointer;
            text-align: center;
        }
        .choice-btn:hover { background: #3b82f6; transform: scale(1.02); }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }
    </style>
</head>
<body>

    <!-- Main Game Container -->
    <div id="game-container">
        
        <!-- Main Menu -->
        <div id="main-menu">
            <h1 class="text-5xl md:text-7xl font-bold text-white mb-4 tracking-wider drop-shadow-lg">The Quantum Cafe</h1>
            <p class="text-xl text-gray-300 mb-12 drop-shadow">A Visual Novel Engine Demo</p>
            <button onclick="engine.startGame()" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-xl transition-all shadow-lg hover:shadow-blue-500/50">
                Start Story
            </button>
        </div>

        <div id="bg-layer"></div>
        <div id="sprite-layer"></div>

        <div id="ui-layer">
            <div id="choice-container"></div>
            
            <div id="textbox-container" onclick="engine.advance()">
                <div id="speaker-name">Name</div>
                <div id="dialog-text"></div>
                <div class="click-indicator" id="click-indicator">▼</div>
            </div>
        </div>
    </div>

    <script>
        /* =====================================================================
           THE SCRIPT: Write your story here!
           
           Commands available in the array:
           { bg: "image_url" }                  -> Changes background
           { show: "charId", img: "url", pos: "left|center|right" } -> Shows a character
           { hide: "charId" }                   -> Hides a character
           { speaker: "Name", text: "..." }     -> Shows dialog. Omit 'speaker' for narration.
           { choices: [ {text: "..", jump: "scene"} ] } -> Shows branching choices
           { jump: "scene_name" }               -> Jumps to another part of the script
           { end: true }                        -> Ends the game and returns to menu
        ======================================================================== */

        const myStoryScript = {
            "start": [
                { bg: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=1600&q=80" },
                { text: "The bell above the door chimes as you step into the 'Quantum Cafe'." },
                { text: "It smells faintly of roasted beans and ozone." },
                { show: "barista", img: "https://api.dicebear.com/9.x/avataaars/svg?seed=Felix&backgroundColor=transparent", pos: "center" },
                { speaker: "Barista", text: "Welcome! We weren't expecting you in this timeline." },
                { speaker: "Barista", text: "What can I get started for you today?" },
                { choices: [
                    { text: "I'll have a dark roast coffee.", jump: "route_coffee" },
                    { text: "Some green tea, please.", jump: "route_tea" },
                    { text: "Where am I exactly?", jump: "route_question" }
                ]}
            ],

            "route_coffee": [
                { speaker: "Barista", text: "Ah, the dark roast. Excellent choice for those needing an energy spike." },
                { hide: "barista" },
                { text: "He turns around, and you hear the whirring of complex, glowing machinery." },
                { show: "barista", img: "https://api.dicebear.com/9.x/avataaars/svg?seed=Felix&backgroundColor=transparent", pos: "center" },
                { speaker: "Barista", text: "Here you go. Careful, it transcends space and time." },
                { text: "You take a sip. Suddenly, the world shifts around you..." },
                { bg: "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1600&q=80" }, // Nebula
                { hide: "barista" },
                { text: "You are now floating in a vibrant nebula, fully caffeinated." },
                { jump: "ending" }
            ],

            "route_tea": [
                { speaker: "Barista", text: "Green tea. A grounding choice." },
                { show: "cat", img: "https://api.dicebear.com/9.x/shapes/svg?seed=Whiskers&backgroundColor=transparent", pos: "left" },
                { text: "A strange, geometric cat hops onto the counter." },
                { speaker: "Barista", text: "Don't mind Whiskers. He just likes the smell of the leaves." },
                { text: "You drink the tea. A profound sense of peace washes over you." },
                { jump: "ending" }
            ],

            "route_question": [
                { speaker: "Barista", text: "You're at the nexus of all possible mornings." },
                { speaker: "Barista", text: "But honestly? We just serve good drinks. Pick one!" },
                { jump: "start" } // Loop back to the beginning!
            ],

            "ending": [
                { text: "Thanks for visiting the Quantum Cafe!" },
                { end: true }
            ]
        };

        /* =====================================================================
           THE ENGINE: Core logic (Do not edit unless modifying engine behavior)
        ======================================================================== */
        
        class VNEngine {
            constructor(script) {
                this.script = script;
                this.currentScene = "";
                this.currentIndex = 0;
                this.isTyping = false;
                this.typeInterval = null;
                this.activeSprites = {}; 
                
                // DOM Elements
                this.els = {
                    menu: document.getElementById('main-menu'),
                    bg: document.getElementById('bg-layer'),
                    sprites: document.getElementById('sprite-layer'),
                    textboxCon: document.getElementById('textbox-container'),
                    speaker: document.getElementById('speaker-name'),
                    dialog: document.getElementById('dialog-text'),
                    clickInd: document.getElementById('click-indicator'),
                    choices: document.getElementById('choice-container')
                };
            }

            startGame(startScene = "start") {
                this.els.menu.style.display = 'none';
                this.els.textboxCon.style.display = 'block';
                this.currentScene = startScene;
                this.currentIndex = 0;
                this.activeSprites = {};
                this.els.sprites.innerHTML = ''; // Clear sprites
                this.processNode();
            }

            endGame() {
                this.els.menu.style.display = 'flex';
                this.els.textboxCon.style.display = 'none';
                this.els.bg.style.backgroundImage = '';
                this.els.sprites.innerHTML = '';
            }

            advance() {
                // If choices are active, prevent clicking the textbox to advance
                if (this.els.choices.style.display === 'flex') return;

                if (this.isTyping) {
                    // Fast forward typing
                    clearInterval(this.typeInterval);
                    this.isTyping = false;
                    const node = this.script[this.currentScene][this.currentIndex];
                    this.els.dialog.innerHTML = node.text;
                    this.els.clickInd.style.display = 'block';
                } else {
                    // Next node
                    this.currentIndex++;
                    this.processNode();
                }
            }

            processNode() {
                const scene = this.script[this.currentScene];
                if (!scene || this.currentIndex >= scene.length) {
                    console.warn("End of scene reached with no jump command.");
                    this.endGame();
                    return;
                }

                const node = scene[this.currentIndex];
                let pauseForInput = false;

                // Handle Engine Commands sequentially
                if (node.end) {
                    this.endGame();
                    return;
                }

                if (node.jump) {
                    this.currentScene = node.jump;
                    this.currentIndex = 0;
                    this.processNode();
                    return;
                }

                if (node.bg) {
                    this.els.bg.style.backgroundImage = `url('${node.bg}')`;
                }

                if (node.show) {
                    this.showCharacter(node.show, node.img, node.pos);
                }

                if (node.hide) {
                    this.hideCharacter(node.hide);
                }

                if (node.choices) {
                    this.showChoices(node.choices);
                    pauseForInput = true;
                    this.els.textboxCon.style.display = 'none'; // Hide textbox during choices
                }

                if (node.text !== undefined) {
                    this.showText(node.speaker, node.text);
                    pauseForInput = true;
                }

                // If command doesn't require user input (like just changing bg/sprites), automatically process the next one
                if (!pauseForInput) {
                    this.currentIndex++;
                    this.processNode();
                }
            }

            showCharacter(id, imgUrl, pos = 'center') {
                if (!this.activeSprites[id]) {
                    const img = document.createElement('img');
                    img.src = imgUrl;
                    img.className = `sprite pos-${pos}`;
                    img.id = `sprite-${id}`;
                    this.els.sprites.appendChild(img);
                    this.activeSprites[id] = img;
                    
                    // Trigger reflow for animation
                    void img.offsetWidth;
                    img.classList.add('active');
                } else {
                    // Update existing
                    const img = this.activeSprites[id];
                    img.src = imgUrl;
                    img.className = `sprite pos-${pos} active`;
                }
            }

            hideCharacter(id) {
                const img = this.activeSprites[id];
                if (img) {
                    img.classList.remove('active');
                    setTimeout(() => {
                        if(img.parentNode) img.parentNode.removeChild(img);
                        delete this.activeSprites[id];
                    }, 300); // Matches CSS transition time
                }
            }

            showText(speaker, text) {
                this.els.textboxCon.style.display = 'block';
                this.els.clickInd.style.display = 'none';
                
                if (speaker) {
                    this.els.speaker.innerText = speaker;
                    this.els.speaker.style.display = 'block';
                } else {
                    this.els.speaker.style.display = 'none';
                }

                this.els.dialog.innerHTML = '';
                this.isTyping = true;
                let charIndex = 0;

                clearInterval(this.typeInterval);
                this.typeInterval = setInterval(() => {
                    if (charIndex < text.length) {
                        this.els.dialog.innerHTML += text.charAt(charIndex);
                        charIndex++;
                    } else {
                        clearInterval(this.typeInterval);
                        this.isTyping = false;
                        this.els.clickInd.style.display = 'block';
                    }
                }, 20); // Typing speed
            }

            showChoices(choices) {
                this.els.choices.innerHTML = '';
                choices.forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = c.text;
                    btn.onclick = (e) => {
                        e.stopPropagation(); // Prevent triggering textbox click
                        this.els.choices.style.display = 'none';
                        this.els.textboxCon.style.display = 'block';
                        this.currentScene = c.jump;
                        this.currentIndex = 0;
                        this.processNode();
                    };
                    this.els.choices.appendChild(btn);
                });
                this.els.choices.style.display = 'flex';
            }
        }

        // Initialize Engine
        const engine = new VNEngine(myStoryScript);

    </script>
</body>
</html>
