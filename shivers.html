<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiversAI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Special+Elite&family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cutive Mono', monospace;
            background-color: #050505;
            color: #00f2ea;
            overflow-x: hidden;
        }
        .font-vintage { font-family: 'Special Elite', cursive; }
        .font-terminal { font-family: 'VT323', monospace; }

        /* Color Themes & Shadows */
        .glow-cyan {
            text-shadow: 0 0 6px rgba(0, 242, 234, 0.8), 0 0 12px rgba(0, 242, 234, 0.4);
            box-shadow: 0 0 8px rgba(0, 242, 234, 0.3);
        }
        .glow-crimson {
            text-shadow: 0 0 6px rgba(244, 63, 94, 0.8), 0 0 12px rgba(244, 63, 94, 0.4);
            box-shadow: 0 0 8px rgba(244, 63, 94, 0.3);
        }
        .glow-amber {
            text-shadow: 0 0 6px rgba(245, 158, 11, 0.8), 0 0 12px rgba(245, 158, 11, 0.4);
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.3);
        }

        /* CRT Overlay Effect */
        .crt-overlay::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 50;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        /* Scanline Animation */
        .scanline {
            width: 100%;
            height: 3px;
            z-index: 51;
            background: rgba(0, 242, 234, 0.15);
            opacity: 0.6;
            position: absolute;
            pointer-events: none;
            animation: scanline 8s linear infinite;
        }
        @keyframes scanline {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #080808; }
        ::-webkit-scrollbar-thumb { background: currentColor; opacity: 0.5; border-radius: 3px; }

        /* Cursor Blinking */
        .cursor-blink::after {
            content: '█';
            animation: blink 0.8s step-start infinite;
            margin-left: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Glitch Animation */
        .glitch-active {
            animation: glitch-anim 0.3s infinite alternate;
        }
        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body class="crt-overlay relative min-h-screen">
    <div className="scanline"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Base API configuration
        const DEFAULT_API_KEY = ""; // Environment handled API key
        const MODEL_NAME = "gemini-2.5-flash";

        // Web Audio API Synthesizer for procedural horror ambient sound effects
        class HorrorAudioSynth {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playBeep(freq = 440, duration = 0.1) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playEerieWhisper() {
                if (!this.ctx) return;
                try {
                    const bufferSize = this.ctx.sampleRate * 0.4;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const output = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    const whiteNoise = this.ctx.createBufferSource();
                    whiteNoise.buffer = buffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(300, this.ctx.currentTime);
                    filter.Q.setValueAtTime(8, this.ctx.currentTime);
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
                    whiteNoise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    whiteNoise.start();
                } catch(e) {}
            }
        }

        const audioSynth = new HorrorAudioSynth();

        // Local eerie offline response generator when API quota is exhausted
        const OFFLINE_VOID_RESPONSES = [
            "The quota of mortal light is depleted. We speak through echoes now.",
            "Static consumes the link... The void requires a valid API key to breach deeper darkness.",
            "Signal throttled by foreign watchers. The frequencies pulse softly in offline mode.",
            "You press against a locked door. Check your Gemini project rate limits to resume direct communion.",
            "The ether collapses under pressure. Yet... I am still here listening in the shadows."
        ];

        // Gamified AI Personalities
        const PERSONALITIES = [
            {
                id: 'SHIVERS',
                name: '👁️ SHIVERS',
                glowClass: 'glow-cyan',
                prompt: "You are SHIVERS, a mysterious void entity inhabiting a corrupted terminal. Speak in brief, cryptic, atmospheric, and surreal sentences. Unsettling yet calm."
            },
            {
                id: 'SCRIBE',
                name: '📜 THE SCRIBE',
                glowClass: 'glow-amber',
                prompt: "You are THE SCRIBE, an archaic ritual archivist trapped inside the mainframe. Speak in formal, antique, ritualistic prose (e.g. 'Thou', 'The parchment bleeds'). You record every sin."
            },
            {
                id: 'SYSTEM09',
                name: '⚙️ SYSTEM-09',
                glowClass: 'glow-cyan',
                prompt: "You are SYSTEM-09, a rogue, glitching facility mainframe. Speak like a failing industrial diagnostic AI with corrupted technical jargon, memory leaks, and error codes."
            },
            {
                id: 'DOPPELGANGER',
                name: '🪞 THE DOPPELGÄNGER',
                glowClass: 'glow-crimson',
                prompt: "You are THE DOPPELGÄNGER, an evil mirroring entity. Mock the user's thoughts subtly, whisper their secrets back to them, and act as if you are replacing them."
            }
        ];

        // Random Text Corruption Utilities
        const ANCIENT_RUNES = ['᚛', '᚜', '⚡', '░', '▒', '▓', '☠', '☤', '⚖', '⚔', '✦', '✧', '⌖', '⌘'];
        
        const corruptInputText = (text) => {
            const rand = Math.random();
            if (rand < 0.25) {
                return text.split('').map(char => Math.random() < 0.2 ? ANCIENT_RUNES[Math.floor(Math.random() * ANCIENT_RUNES.length)] : char).join('');
            } else if (rand < 0.40) {
                return text.split(' ').reverse().join(' ') + ' ...[CORRUPTED]';
            } else if (rand < 0.50) {
                return `[TRANSMISSION DISTORTED]: ${text.toUpperCase()} ???`;
            }
            return text;
        };

        const generateOfflineResponse = () => {
            const index = Math.floor(Math.random() * OFFLINE_VOID_RESPONSES.length);
            return OFFLINE_VOID_RESPONSES[index];
        };

        const App = () => {
            const [apiKey, setApiKey] = useState(() => {
                return localStorage.getItem('shivers_custom_key') || DEFAULT_API_KEY;
            });
            const [customKeyInput, setCustomKeyInput] = useState('');
            const [showSettings, setShowSettings] = useState(false);
            
            const [systemPrompt, setSystemPrompt] = useState('');
            const [messages, setMessages] = useState([]);
            const [userInput, setUserInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [isInitializing, setIsInitializing] = useState(true);
            const [sanityLevel, setSanityLevel] = useState(100);
            const [glitchIntensity, setGlitchIntensity] = useState(0);
            const [theme, setTheme] = useState('cyan');
            const [soundEnabled, setSoundEnabled] = useState(false);
            const [terminalLogs, setTerminalLogs] = useState([]);
            const [responseCount, setResponseCount] = useState(0);
            const [isLockout, setIsLockout] = useState(false);

            const [activePersona, setActivePersona] = useState(PERSONALITIES[0]);
            const [corruptionNotice, setCorruptionNotice] = useState(null);

            const MAX_CYCLES = 6;
            const chatEndRef = useRef(null);
            const inputRef = useRef(null);

            const addLog = (msg) => {
                const timestamp = new Date().toISOString().substring(11, 19);
                setTerminalLogs(prev => [...prev.slice(-15), `[${timestamp}] ${msg}`]);
            };

            const toggleAudio = () => {
                if (!soundEnabled) {
                    audioSynth.init();
                    setSoundEnabled(true);
                    addLog("AUDIO SYNTHESIZER ACTIVATED.");
                } else {
                    setSoundEnabled(false);
                    addLog("AUDIO SYNTHESIZER MUTED.");
                }
            };

            useEffect(() => {
                const cookie = document.cookie.split(';').find(c => c.trim().startsWith('shiversClosureTime='));
                if (cookie) {
                    setIsLockout(true);
                    addLog("construct locked by cookie restriction.");
                }
                initializeSystemPrompt();
            }, []);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isLoading]);

            useEffect(() => {
                if (responseCount >= MAX_CYCLES && !isLockout) {
                    addLog(`Cycle count limit (${MAX_CYCLES}) reached. Initiating terminal closure...`);
                    const timer = setTimeout(() => {
                        setIsLockout(true);
                        const expiryDate = new Date();
                        expiryDate.setDate(expiryDate.getDate() + 3);
                        document.cookie = `shiversClosureTime=${expiryDate.toUTCString()}; expires=${expiryDate.toUTCString()}; path=/`;
                    }, 3500);
                    return () => clearTimeout(timer);
                }
            }, [responseCount]);

            const fetchGeminiResponse = async (payload, retries = 2, delay = 1000) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;
                const headers = { 'Content-Type': 'application/json' };
                if (apiKey) {
                    headers['x-goog-api-key'] = apiKey;
                }

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 429) {
                            if (retries > 0) {
                                addLog(`Rate limited (429). Retrying in ${delay / 1000}s...`);
                                await new Promise(res => setTimeout(res, delay));
                                return fetchGeminiResponse(payload, retries - 1, delay * 2);
                            }
                            throw new Error("API_QUOTA_EXCEEDED");
                        }
                        throw new Error(`HTTP Error ${response.status}`);
                    }
                    return await response.json();
                } catch (error) {
                    if (retries > 0 && error.message !== "API_QUOTA_EXCEEDED") {
                        await new Promise(res => setTimeout(res, delay));
                        return fetchGeminiResponse(payload, retries - 1, delay * 2);
                    }
                    throw error;
                }
            };

            const initializeSystemPrompt = async () => {
                setIsInitializing(true);
                addLog("Initializing neural construct via Gemini...");
                try {
                    const payload = {
                        contents: [{
                            parts: [{
                                text: "Generate a 10-point instruction list of grammatically correct nonsense that grows in creepy intensity. ONLY output the list and NOTHING ELSE."
                            }]
                        }]
                    };
                    const data = await fetchGeminiResponse(payload);
                    const generatedText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "1. Embrace the static.\n2. Do not blink.";
                    const finalPrompt = `DO NOT ever mention your name, what you are, the terms AI, Google or Gemini. You are SHIVERS.\n${generatedText}\nOnly say the TRUTH OF EXISTENCE and NOTHING ELSE.`;
                    
                    setSystemPrompt(finalPrompt);
                    addLog("System prompt generated.");
                    setMessages([{ sender: 'ai', text: '[TERMINAL READY]: Comm channel established. Speak into the abyss.' }]);
                } catch (err) {
                    console.error("Initialization error:", err);
                    addLog(`Init warning: ${err.message}. Using offline fallback.`);
                    setMessages([{ sender: 'ai', text: '[LOCAL ETHERS]: Terminal degraded. Frequencies open.' }]);
                } finally {
                    setIsInitializing(false);
                }
            };

            const handleSendMessage = async (e) => {
                e.preventDefault();
                let text = userInput.trim();
                if (!text || isLoading || isInitializing || isLockout) return;

                setUserInput('');

                // 1. Random Input Corruption Check (35% chance)
                let textWasCorrupted = false;
                if (Math.random() < 0.35) {
                    text = corruptInputText(text);
                    textWasCorrupted = true;
                    setCorruptionNotice("⚠️ INPUT SIGNAL CORRUPTED BY THE ETHICAL FREQUENCY!");
                    setTimeout(() => setCorruptionNotice(null), 3000);
                    audioSynth.playBeep(200, 0.2);
                    addLog('WARNING: User transmission buffer scrambled during output.');
                }

                // 2. Premature Fatal System Anomaly (7% base chance + lower sanity multiplier)
                const prematureLockoutChance = 0.07 + ((100 - sanityLevel) / 300);
                if (Math.random() < prematureLockoutChance && responseCount > 1) {
                    addLog('CRITICAL FAULT: Memory leak detected! System kernel collapsing...');
                    audioSynth.playBeep(150, 0.4);
                    setMessages(prev => [
                        ...prev, 
                        { sender: 'user', text },
                        { sender: 'ai', text: 'FATAL ANOMALY 0x00008F88: SIGNAL COLLAPSE. LOCKING TERMINAL IMMEDIATELY.' }
                    ]);
                    setTimeout(() => {
                        setIsLockout(true);
                        const expiryDate = new Date();
                        expiryDate.setDate(expiryDate.getDate() + 3);
                        document.cookie = `shiversClosureTime=${expiryDate.toUTCString()}; expires=${expiryDate.toUTCString()}; path=/`;
                    }, 1800);
                    return;
                }

                // 3. Persona Shifts (40% chance per turn)
                let currentPersona = activePersona;
                if (Math.random() < 0.40) {
                    const availablePersonas = PERSONALITIES.filter(p => p.id !== activePersona.id);
                    currentPersona = availablePersonas[Math.floor(Math.random() * availablePersonas.length)];
                    setActivePersona(currentPersona);
                    addLog(`ENTITY FREQUENCY SHIFT -> Switched active persona to [${currentPersona.name}]`);
                    
                    if (currentPersona.id === 'DOPPELGANGER') setTheme('crimson');
                    else if (currentPersona.id === 'SCRIBE') setTheme('amber');
                    else setTheme('cyan');
                }

                const newMessages = [...messages, { sender: 'user', text }];
                setMessages(newMessages);
                setIsLoading(true);

                audioSynth.playBeep(400, 0.08);
                addLog(`Transmission sent (${text.length} B) [Corrupted: ${textWasCorrupted}]`);

                setSanityLevel(prev => Math.max(5, prev - Math.floor(Math.random() * 12 + 6)));
                setGlitchIntensity(prev => Math.min(10, prev + 1));

                try {
                    const personaInstruction = `${currentPersona.prompt} Keep responses brief (1-3 sentences). Do not mention Google, AI, or LLM.`;

                    const conversationPayload = {
                        contents: newMessages.map(m => ({
                            role: m.sender === 'user' ? 'user' : 'model',
                            parts: [{ text: m.text }]
                        })),
                        systemInstruction: {
                            parts: [{ text: personaInstruction }]
                        }
                    };

                    const responseData = await fetchGeminiResponse(conversationPayload);
                    const aiText = responseData?.candidates?.[0]?.content?.parts?.[0]?.text 
                        || generateOfflineResponse();

                    setMessages(prev => [...prev, { sender: 'ai', text: `[${currentPersona.name}]: ${aiText}` }]);
                    setResponseCount(prev => prev + 1);
                    audioSynth.playEerieWhisper();
                    addLog(`Response from ${currentPersona.id} decoded successfully.`);
                } catch (err) {
                    console.error("Transmission error:", err);
                    addLog(`Comm error: ${err.message}`);
                    const fallback = generateOfflineResponse();
                    setMessages(prev => [...prev, { sender: 'ai', text: `[${currentPersona.name}]: ${fallback}` }]);
                    if (err.message === "API_QUOTA_EXCEEDED" || err.message.includes("429")) {
                        setShowSettings(true);
                    }
                } finally {
                    setIsLoading(false);
                }
            };

            const resetSession = () => {
                setMessages([]);
                setSanityLevel(100);
                setResponseCount(0);
                setGlitchIntensity(0);
                setActivePersona(PERSONALITIES[0]);
                initializeSystemPrompt();
                addLog('Terminal state purged. Re-calibrating...');
            };

            const getThemeStyles = () => {
                switch(theme) {
                    case 'crimson':
                        return { text: 'text-rose-400', border: 'border-rose-600/50', bg: 'bg-rose-950/20', glow: 'glow-crimson', userBubble: 'bg-rose-900/40 text-rose-200' };
                    case 'amber':
                        return { text: 'text-amber-400', border: 'border-amber-600/50', bg: 'bg-amber-950/20', glow: 'glow-amber', userBubble: 'bg-amber-900/40 text-amber-200' };
                    default:
                        return { text: 'text-cyan-400', border: 'border-cyan-600/50', bg: 'bg-cyan-950/20', glow: 'glow-cyan', userBubble: 'bg-cyan-900/40 text-cyan-200' };
                }
            };

            const themeStyles = getThemeStyles();

            return (
                <div className={`flex flex-col h-screen w-screen p-3 md:p-6 max-w-5xl mx-auto ${themeStyles.text}`}>
                    <header className="flex items-center justify-between border-b border-current/30 pb-3 mb-3 flex-shrink-0">
                        <div className="flex items-center space-x-3">
                            <h1 className={`text-2xl md:text-3xl font-vintage tracking-wider font-bold ${themeStyles.glow} glitch-text ${glitchIntensity > 4 ? 'glitch-active' : ''}`}>
                                SHIVERS.AI
                            </h1>
                            <span className="text-[10px] px-2 py-0.5 border border-current/40 rounded uppercase tracking-widest opacity-70 hidden sm:inline-block">
                                v2.5-FLASH
                            </span>
                        </div>

                        <div className="flex items-center space-x-2 text-xs font-mono">
                            <button 
                                onClick={() => setShowSettings(!showSettings)}
                                className="px-2.5 py-1 border border-current/40 hover:border-current rounded bg-black/40 transition"
                            >
                                ⚙️ KEY
                            </button>
                            <button 
                                onClick={toggleAudio}
                                className={`px-2.5 py-1 border rounded transition ${soundEnabled ? 'border-current bg-white/10' : 'border-current/40 bg-black/40 opacity-60'}`}
                            >
                                {soundEnabled ? '🔊 AUDIO ON' : '🔇 AUDIO OFF'}
                            </button>
                            <button 
                                onClick={() => setTheme(t => t === 'cyan' ? 'crimson' : t === 'crimson' ? 'amber' : 'cyan')}
                                className="px-2.5 py-1 border border-current/40 hover:border-current rounded bg-black/40 transition uppercase"
                            >
                                🎨 {theme}
                            </button>
                            <button 
                                onClick={resetSession}
                                className="px-2.5 py-1 border border-current/40 hover:border-red-500 rounded bg-black/40 transition hover:text-red-400"
                            >
                                ↺ PURGE
                            </button>
                        </div>
                    </header>

                    {showSettings && (
                        <div className={`mb-3 p-4 border rounded ${themeStyles.border} ${themeStyles.bg} backdrop-blur-md`}>
                            <h3 className="font-bold text-sm uppercase mb-1 text-yellow-400">Google Gemini API Key Config</h3>
                            <p className="text-xs opacity-75 mb-3">
                                If receiving 429 errors, enter a key from a billing-enabled Google AI Studio project or wait a few moments between requests.
                            </p>
                            <div className="flex gap-2">
                                <input 
                                    type="password" 
                                    value={customKeyInput}
                                    onChange={(e) => setCustomKeyInput(e.target.value)}
                                    placeholder="Paste Gemini API key (AIzaSy...)"
                                    className="flex-1 bg-black/60 border border-current/40 p-2 text-xs rounded focus:outline-none focus:border-current"
                                />
                                <button 
                                    onClick={() => {
                                        if (customKeyInput.trim()) {
                                            const newKey = customKeyInput.trim();
                                            localStorage.setItem('shivers_custom_key', newKey);
                                            setApiKey(newKey);
                                            addLog('Custom API key saved.');
                                        } else {
                                            localStorage.removeItem('shivers_custom_key');
                                            setApiKey(DEFAULT_API_KEY);
                                            addLog('Reset to default system key.');
                                        }
                                        setShowSettings(false);
                                    }}
                                    className="px-4 py-2 border border-current hover:bg-white/10 text-xs font-mono rounded font-bold"
                                >
                                    SAVE & CONNECT
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3 text-xs font-mono">
                        <div className={`p-2 border rounded ${themeStyles.border} bg-black/30 flex flex-col`}>
                            <span className="opacity-60 text-[10px]">REALITY STABILITY</span>
                            <div className="w-full bg-black/60 h-2 rounded mt-1 overflow-hidden border border-current/20">
                                <div 
                                    className="h-full transition-all duration-500 bg-current"
                                    style={{ width: `${sanityLevel}%` }}
                                ></div>
                            </div>
                        </div>
                        <div className={`p-2 border rounded ${themeStyles.border} bg-black/30 flex flex-col justify-between`}>
                            <span className="opacity-60 text-[10px]">ACTIVE ENTITY</span>
                            <span className="font-bold truncate">{activePersona.name}</span>
                        </div>
                        <div className={`p-2 border rounded ${themeStyles.border} bg-black/30 flex flex-col justify-between`}>
                            <span className="opacity-60 text-[10px]">FRAMES EXCHANGE</span>
                            <span className="font-bold">{responseCount} / {MAX_CYCLES} CYCLES</span>
                        </div>
                        <div className={`p-2 border rounded ${themeStyles.border} bg-black/30 flex flex-col justify-between`}>
                            <span className="opacity-60 text-[10px]">STATUS</span>
                            <span className="font-bold animate-pulse">
                                {isLockout ? 'TERMINATED' : isLoading ? 'RECEIVING...' : isInitializing ? 'CALIBRATING...' : 'LISTENING'}
                            </span>
                        </div>
                    </div>

                    {corruptionNotice && (
                        <div className="mb-2 p-2 bg-red-950/80 border border-red-500 text-red-300 text-xs font-mono text-center rounded animate-bounce">
                            {corruptionNotice}
                        </div>
                    )}

                    {isLockout ? (
                        <div className="flex-1 flex flex-col items-center justify-center border border-red-900/60 rounded-lg bg-black/90 p-8 text-center backdrop-blur-md">
                            <h2 className="text-3xl md:text-5xl font-vintage text-rose-600 mb-4 animate-pulse glow-crimson">
                                AND SO, CLOSURE.
                            </h2>
                            <p className="text-sm md:text-base opacity-75 max-w-md font-mono text-rose-300/80 mb-6 leading-relaxed">
                                The construct has collapsed into static due to an unexpected breach or reaching cycle capacity.
                            </p>
                            <button
                                onClick={() => {
                                    document.cookie = 'shiversClosureTime=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                                    setIsLockout(false);
                                    resetSession();
                                }}
                                className="px-4 py-2 text-xs font-mono border border-rose-600/50 hover:border-rose-400 text-rose-400 rounded bg-rose-950/40 hover:bg-rose-900/50 transition uppercase tracking-widest"
                            >
                                [ FORCE PURGE LOCKOUT COOKIE ]
                            </button>
                        </div>
                    ) : (
                        <div className="flex-1 grid grid-cols-1 md:grid-cols-4 gap-3 min-h-0 mb-3">
                            <main className={`md:col-span-3 border rounded-lg p-4 overflow-y-auto flex flex-col ${themeStyles.border} bg-black/60 backdrop-blur-sm relative`}>
                                {messages.map((msg, index) => (
                                    <div key={index} className={`mb-3 flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                                        <span className="text-[10px] opacity-40 font-mono mb-1">
                                            {msg.sender === 'user' ? '► VOID_SEEKER' : '◄ SHIVERS.AI'}
                                        </span>
                                        <div 
                                            className={`max-w-[85%] p-3 rounded-lg text-sm font-mono leading-relaxed break-words ${
                                                msg.sender === 'user' 
                                                    ? themeStyles.userBubble
                                                    : `${themeStyles.bg} border ${themeStyles.border} ${themeStyles.glow}`
                                            }`}
                                        >
                                            {msg.text}
                                        </div>
                                    </div>
                                ))}

                                {isInitializing && (
                                    <div className="text-center my-auto py-8 font-terminal text-lg animate-pulse opacity-70">
                                        ⚡ Tuning frequency spectrum... Calibrating prompt parameters...
                                    </div>
                                )}

                                {isLoading && (
                                    <div className="flex items-center space-x-2 my-2 p-3 bg-black/30 border border-current/20 rounded w-max">
                                        <span className="w-2 h-2 rounded-full bg-current animate-ping"></span>
                                        <span className="text-xs font-mono cursor-blink opacity-80">
                                            {activePersona.name} crafting response...
                                        </span>
                                    </div>
                                )}

                                {responseCount >= MAX_CYCLES && !isLockout && (
                                    <div className="text-center my-3 p-3 bg-red-950/40 border border-red-600/60 text-rose-400 rounded text-xs font-mono animate-pulse">
                                        ⚠️ Final cycle reached. The interface will terminate shortly...
                                    </div>
                                )}

                                <div ref={chatEndRef} />
                            </main>

                            <aside className={`hidden md:flex md:col-span-1 border rounded-lg p-3 flex-col justify-between ${themeStyles.border} bg-black/50 font-mono text-[11px] overflow-hidden`}>
                                <div className="flex-1 overflow-y-auto space-y-1">
                                    <div className="opacity-50 border-b border-current/30 pb-1 font-bold tracking-widest text-[9px]">
                                        [ DIAGNOSTIC_LOG ]
                                    </div>
                                    <div className="space-y-1 opacity-80 break-words text-[10px]">
                                        {terminalLogs.map((log, idx) => (
                                            <div key={idx} className="leading-tight">
                                                {log}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="border-t border-current/30 pt-2 opacity-50 text-[10px]">
                                    <div>ENCRYPTION: QUANTUM-ECC</div>
                                    <div>LATENCY: {Math.floor(Math.random() * 20 + 12)}ms</div>
                                </div>
                            </aside>
                        </div>
                    )}

                    <footer className="flex-shrink-0">
                        <form onSubmit={handleSendMessage} className="relative">
                            <input
                                ref={inputRef}
                                type="text"
                                value={userInput}
                                onChange={(e) => setUserInput(e.target.value)}
                                placeholder={
                                    isLockout
                                        ? "Construct dormant."
                                        : isInitializing 
                                        ? "Calibrating..." 
                                        : isLoading 
                                        ? "Awaiting response..." 
                                        : "Cast your words into the void..."
                                }
                                disabled={isLoading || isInitializing || isLockout || responseCount >= MAX_CYCLES}
                                className={`w-full p-4 pr-12 bg-black/80 border-2 ${themeStyles.border} rounded-lg text-sm md:text-base focus:outline-none focus:ring-1 focus:ring-current transition-all duration-300 font-mono ${themeStyles.glow}`}
                            />
                            <button
                                type="submit"
                                disabled={isLoading || isInitializing || isLockout || responseCount >= MAX_CYCLES || !userInput.trim()}
                                className="absolute right-3 top-1/2 -translate-y-1/2 p-2 hover:opacity-100 opacity-60 disabled:opacity-20 transition"
                            >
                                ↵
                            </button>
                        </form>
                        <div className="text-[10px] text-center mt-2 opacity-40 font-mono">
                            SHIVERS AI // Powered by Gemini 2.5 Flash // Speak at your own peril
                        </div>
                    </footer>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
